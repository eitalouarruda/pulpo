name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite lanzar el build a mano desde la pestaña Actions.
  workflow_dispatch:

# Un push nuevo cancela el build anterior de la misma rama, salvo en main:
# ahí cada push es una release y se deja terminar.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Versión de CEF (Chromium) que usa tauri-runtime-cef; la clave de su caché.
  CEF_VERSION: "152.0.6"
  # La AppImage usa ese mismo CEF pero con códecs propietarios (H.264, AAC: los
  # GIF de Discord son MP4, videos, audios), armado con scripts/cef-codecs.sh
  # y subido a la release cef-<versión>-codecs. Al cambiar CEF_VERSION hay que
  # correr `scripts/cef-codecs.sh <versión> --upload` y poner aquí el sha256.
  CEF_CODECS_SHA256: "74a0a90bf5072f67cc2ebb28f27011ce305e0842017034c511a0f4687723a394"
  # El CLI de Tauri 3 arma la AppImage con quick-sharun (Anylinux-AppImages),
  # que baja estas piezas de la rama main; en sep/2026 se movieron y las rutas
  # dan 404. Se fijan al último commit que las tenía.
  ANYLINUX_BASE: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/5e76c43e12c20ccb2f705c6098ca141b2fd368f8/useful-tools

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows también: el bloqueo de WebView2 solo compila allí.
        platform: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space (Chromium ocupa varios GB)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # En Linux `target/` lleva copias de Chromium: no se cachea.
          cache-targets: ${{ runner.os != 'Linux' }}
      - name: Cache CEF
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri-cef
          key: cef-${{ runner.os }}-${{ env.CEF_VERSION }}
      # GTK 4.12+ (lo exige muda): Ubuntu 24.04 trae la 4.14, la 22.04 solo 4.6.
      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev librsvg2-dev cmake ninja-build xvfb python3-gi gir1.2-gtk-4.0 libxtst6
      # tauri::generate_context! necesita el frontend compilado en dist/.
      - name: Placeholder frontend
        shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - name: Format check
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace
      - uses: pnpm/action-setup@v4
        if: runner.os == 'Linux'
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 22
          cache: pnpm
      - name: Build Linux test application
        if: runner.os == 'Linux'
        env:
          TAURI_CONFIG: '{"build":{"devUrl":null}}'
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          cargo build --locked --manifest-path src-tauri/Cargo.toml
      - name: Configure Chromium sandbox for Linux smoke test
        if: runner.os == 'Linux'
        run: |
          # Ubuntu restringe los user namespaces: CEF necesita el helper SUID.
          # Solo se configura el binario generado en este runner efímero.
          sandbox=src-tauri/target/debug/chrome-sandbox
          test -f "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          test "$(stat -c '%u:%g:%a' "$sandbox")" = '0:0:4755'
      - name: Native external file drop regression
        if: runner.os == 'Linux'
        env:
          GDK_BACKEND: x11
        run: xvfb-run -a node scripts/smoke-cef.mjs src-tauri/target/debug/pulpo --native-linux

  # Cada push a main publica una release. La versión es MAJOR.MINOR de
  # tauri.conf.json + el número de ejecución: 0.1.57, 0.1.58, ...
  release:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          base=$(jq -r .version src-tauri/tauri.conf.json | cut -d. -f1,2)
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Borrador hasta que todos los instaladores estén subidos.
          gh release create "v$VERSION" --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" --title "Pulpo v$VERSION" \
            --generate-notes --draft

  # La AppImage lleva sus propias librerías, glibc incluida (sharun), y aun
  # así carga algunas del sistema en tiempo de ejecución: drivers de GPU y
  # módulos de NSS. Si la glibc empaquetada es más vieja que la del sistema,
  # esas fallan (lo que pasó compilando en Ubuntu 24.04 y abriendo en Arch).
  # Compilando en Arch (rolling) la empaquetada es siempre la más nueva, que
  # es compatible hacia atrás con cualquier distro.
  build-linux:
    needs: release
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
      # Para poder liberar espacio del runner desde dentro del contenedor.
      options: >-
        -v /usr/share/dotnet:/host/dotnet
        -v /usr/local/lib/android:/host/android
        -v /opt/ghc:/host/ghc
    env:
      VERSION: ${{ needs.release.outputs.version }}
      CEF_PATH: /opt/tauri-cef
    steps:
      - name: Free disk space (Chromium ocupa varios GB)
        run: rm -rf /host/dotnet/* /host/android/* /host/ghc/* || true
      - name: Install build deps
        run: |
          pacman -Syu --noconfirm --needed \
            git base-devel rust nodejs npm gtk4 librsvg patchelf cmake ninja \
            xorg-server-xvfb xorg-xauth dbus mesa nss strace wget python file \
            alsa-lib libcups at-spi2-core nspr libdrm libglvnd vulkan-icd-loader \
            libxkbcommon libxcomposite libxdamage libxrandr libxcursor libxinerama libxi \
            openh264 brotli libxml2 libjpeg-turbo opus dav1d libwebp freetype2 harfbuzz \
            flac minizip libxslt libpulse libva
          npm install -g pnpm@11.6.0
          # Chromium no arranca como root, y el empaquetador lo ejecuta para
          # descubrir qué librerías carga: el build va con un usuario normal.
          useradd -m builder
          mkdir -p "$CEF_PATH"
      - uses: actions/checkout@v5
      # cef-dll-sys valida la carpeta solo por su archive.json y, si no le
      # sirve, baja el CEF oficial (sin códecs) sin avisar: se comprueba aquí
      # que Cargo.lock pide la versión que hay en la release.
      - name: Check CEF version
        run: |
          locked=$(grep -A1 '^name = "cef-dll-sys"$' src-tauri/Cargo.lock | sed -n 's/^version = ".*+\(.*\)"$/\1/p')
          if [ "$locked" != "$CEF_VERSION" ]; then
            echo "Cargo.lock usa CEF $locked y CEF_VERSION es $CEF_VERSION."
            echo "Corre 'scripts/cef-codecs.sh $locked --upload' y actualiza CEF_VERSION y CEF_CODECS_SHA256."
            exit 1
          fi
      - name: Cache CEF
        id: cef-cache
        uses: actions/cache@v4
        with:
          path: /opt/tauri-cef
          key: cef-arch-${{ env.CEF_VERSION }}-codecs-${{ env.CEF_CODECS_SHA256 }}
      - name: Download CEF with codecs
        if: steps.cef-cache.outputs.cache-hit != 'true'
        run: |
          file="cef-$CEF_VERSION-codecs-linux-x86_64.tar.zst"
          wget -q -O "/tmp/$file" \
            "https://github.com/${{ github.repository }}/releases/download/cef-$CEF_VERSION-codecs/$file" ||
            { echo "Falta $file: corre 'scripts/cef-codecs.sh $CEF_VERSION --upload'."; exit 1; }
          echo "$CEF_CODECS_SHA256  /tmp/$file" | sha256sum -c
          tar --zstd -xf "/tmp/$file" -C "$CEF_PATH" --strip-components 1
          rm "/tmp/$file"
      - name: Build AppImage
        run: |
          chown -R builder "$GITHUB_WORKSPACE" "$CEF_PATH"
          # DEPLOY_CHROMIUM: quick-sharun mete NSS completo, OpenGL, Vulkan y
          # PipeWire, que Chromium carga en tiempo de ejecución (con solo
          # rastrear la app bajo Xvfb no los detecta todos).
          runuser -u builder -- env HOME=/home/builder CEF_PATH="$CEF_PATH" VERSION="$VERSION" \
            WORKDIR="$GITHUB_WORKSPACE" \
            ANYLINUX_LIB_SOURCE="$ANYLINUX_BASE/lib/anylinux.c" \
            GTK_CLASS_FIX_SOURCE="$ANYLINUX_BASE/lib/gtk-class-fix.c" \
            HOOKSRC="$ANYLINUX_BASE/hooks" \
            DEPLOY_CHROMIUM=1 \
            bash -euo pipefail -c '
              cd "$WORKDIR"
              node -e "
                const fs = require(\"fs\");
                const p = \"src-tauri/tauri.conf.json\";
                const c = JSON.parse(fs.readFileSync(p, \"utf8\"));
                c.version = process.env.VERSION;
                fs.writeFileSync(p, JSON.stringify(c, null, 2));
              "
              pnpm install --frozen-lockfile
              pnpm tauri build --bundles appimage
            '

      # Que no se haya colado el CEF oficial: la libcef.so empaquetada tiene que
      # ser la de la carpeta con códecs.
      - name: Check CEF has codecs
        run: cmp src-tauri/target/release/libcef.so "$CEF_PATH/libcef.so"

      # Si el empaquetador dice "missing libraries", aquí se ve cuáles.
      - name: Show missing libraries
        if: failure()
        run: |
          cd src-tauri/target/release
          for f in pulpo libcef.so libEGL.so libGLESv2.so libvk_swiftshader.so; do
            [ -e "$f" ] && ldd "$f" | grep "not found" | sed "s|^|$f: |" || true
          done

      # quick-sharun empaqueta con DwarFS, que AppImageLauncher (y otras
      # herramientas de integración) no saben abrir: "sqfs_open_image error" y
      # la AppImage ni se instala ni arranca. Se reempaqueta el mismo AppDir
      # con el appimagetool clásico (SquashFS), como las AppImages de siempre.
      - name: Repack AppImage as SquashFS
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri/target/release/bundle/appimage
          img=$(ls *.AppImage)
          echo "librerías empaquetadas: $(ls Pulpo.AppDir/lib | wc -l)"
          # NSS carga sus módulos (softokn, freebl) en tiempo de ejecución y
          # el empaquetador no siempre los detecta. Si faltan, la app usa los
          # del sistema con el libnssutil3 empaquetado y Chromium aborta si las
          # versiones no coinciden. Se copian los de este mismo NSS.
          # Lo mismo con OpenGL (libglvnd + Mesa): GTK 4 abre libGLESv2.so.2 y,
          # si el sistema no la tiene, la app se cierra al arrancar.
          for lib in libsoftokn3.so libfreeblpriv3.so libfreebl3.so libsqlite3.so.0 \
                     libGLESv2.so.2 libGL.so.1 libOpenGL.so.0 libGLX_mesa.so.0; do
            [ -e "Pulpo.AppDir/lib/$lib" ] || cp -L "/usr/lib/$lib" Pulpo.AppDir/lib/
          done
          for lib in libnss3.so libnssutil3.so libsoftokn3.so libfreeblpriv3.so \
                     libGLESv2.so.2 libEGL.so.1 libGLX.so.0 libGLX_mesa.so.0; do
            test -e "Pulpo.AppDir/lib/$lib" || { echo "Falta $lib en la AppImage"; exit 1; }
          done
          # El .desktop pide el icono "pulpo" y el AppDir lo trae como Pulpo.png.
          cp Pulpo.AppDir/Pulpo.png Pulpo.AppDir/pulpo.png
          wget -q -O appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          rm "$img"
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run --no-appstream Pulpo.AppDir "$img"
          rm appimagetool
          # Tiene que ser SquashFS ("hsqs") justo después del runtime.
          python3 - "$img" <<'PY'
          import struct, sys
          f = open(sys.argv[1], "rb")
          h = f.read(64)
          shoff = struct.unpack("<Q", h[0x28:0x30])[0]
          shentsize, shnum = struct.unpack("<HH", h[0x3A:0x3E])
          f.seek(shoff + shentsize * shnum)
          magic = f.read(4)
          print("filesystem:", magic)
          sys.exit(0 if magic == b"hsqs" else 1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          compression-level: 0

  # Lo que falló en zanahoria no fue compilar sino abrir la release. La
  # AppImage se arranca en otra distro distinta de la que la compiló (Ubuntu)
  # y solo se publica si sigue viva y sin errores de librerías.
  smoke-linux:
    needs: [release, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Smoke test AppImage
        shell: bash
        run: |
          set -euo pipefail
          img=$(ls *.AppImage)
          ls -lh "$img"
          chmod +x "$img"
          home=$(mktemp -d)
          # Sin FUSE en el runner: el runtime extrae y ejecuta.
          APPIMAGE_EXTRACT_AND_RUN=1 \
          XDG_DATA_HOME=$home/data XDG_CACHE_HOME=$home/cache XDG_CONFIG_HOME=$home/config \
            xvfb-run -a "./$img" > smoke.log 2>&1 &
          pid=$!
          sleep 30
          fail() { echo "$1"; cat smoke.log; exit 1; }
          kill -0 "$pid" 2>/dev/null || fail "La AppImage se cerró al arrancar:"
          test -d "$home/data/com.pulpo.app/cef" || fail "No llegó a iniciar Chromium:"
          # Choques de versiones entre lo empaquetado y el sistema.
          if grep -E "version \`[A-Z_0-9.]+' not found|FATAL:|undefined symbol" smoke.log; then
            fail "Errores de librerías:"
          fi
          echo "Arrancó bien:"; tail -n 20 smoke.log
          kill "$pid" || true
      - name: Upload to release
        run: gh release upload "v$VERSION" *.AppImage --clobber --repo "${{ github.repository }}"

  build-windows:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      # Sin `version`: usa la de "packageManager" en package.json (pnpm 11).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Set release version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
          '
      - name: Build
        run: pnpm tauri build --bundles nsis,msi
      - name: Upload to release
        shell: bash
        run: |
          gh release upload "v$VERSION" \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/msi/*.msi \
            --clobber --repo "${{ github.repository }}"

  # Build real en ambas arquitecturas, también en PR; el test de ejecución
  # sigue siendo una comprobación del paquete antes de publicar.
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-15, macos-15-intel]
        include:
          - platform: macos-15
            arch: aarch64
          - platform: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    env:
      # Firma ad-hoc; Developer ID y notarización se configuran aparte.
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # CEF copies make target/ too large; keep the Cargo download cache.
          cache-targets: false
      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/tauri-cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - name: Set release version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            const base = c.version.split(".").slice(0, 2).join(".");
            c.version = base + "." + process.env.GITHUB_RUN_NUMBER;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            fs.appendFileSync(process.env.GITHUB_ENV, "VERSION=" + c.version + "\n");
          '
      - name: Build frontend
        run: pnpm build
      - name: Test Brave blocker and WebKit rule exporter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p macos-logs
          cargo test --locked --manifest-path src-tauri/Cargo.toml -p blocker --all-features 2>&1 | tee macos-logs/blocker.log
      - name: Check macOS application targets
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings 2>&1 | tee macos-logs/check.log
      - name: Test workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml --workspace 2>&1 | tee macos-logs/tests.log
      - name: Build application bundle
        shell: bash
        run: |
          set -euo pipefail
          pnpm tauri build --bundles app,dmg 2>&1 | tee macos-logs/bundle.log
      - name: Verify bundle signature and CEF helpers
        shell: bash
        run: |
          set -euo pipefail
          app=src-tauri/target/release/bundle/macos/Pulpo.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          test -d "$app/Contents/Frameworks/Chromium Embedded Framework.framework"
          test -d "$app/Contents/Frameworks/Pulpo Helper (Renderer).app"
          codesign --verify --deep --strict --verbose=2 "$app" 2>&1 | tee macos-logs/signature.log
      - name: Smoke test Chromium, session isolation and file drops
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smoke-cef.mjs src-tauri/target/release/bundle/macos/Pulpo.app/Contents/MacOS/pulpo 2>&1 | tee macos-logs/smoke.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-logs-${{ matrix.arch }}
          path: macos-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers-${{ matrix.arch }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0

  upload-macos:
    needs: [release, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-installers-*
          merge-multiple: true
      - name: Upload macOS installers to release
        run: gh release upload "v$VERSION" *.dmg --clobber --repo "${{ github.repository }}"

  # Publica la release solo si todo terminó bien.
  publish:
    needs: [release, smoke-linux, build-windows, upload-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ needs.release.outputs.version }}" \
            --repo "${{ github.repository }}" --draft=false --latest
