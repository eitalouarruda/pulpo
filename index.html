<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Pulpo</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <aside id="sidebar">
      <button id="home" type="button" data-i18n-title="sidebar.home" data-i18n-label="sidebar.home">
        <img src="/pulpo.svg" alt="" draggable="false" />
      </button>
      <nav id="services" data-i18n-label="sidebar.services"></nav>
      <button id="add" type="button" data-i18n-title="sidebar.add" data-i18n-label="sidebar.add">
        <!-- SVG y no el carácter "+": el glifo queda descentrado según la fuente. -->
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path d="M9 2v14M2 9h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <button id="ci" type="button" hidden data-i18n-title="sidebar.ci" data-i18n-label="sidebar.ci">
        <span class="ci-label">CI</span>
        <span class="badge"></span>
      </button>
      <button id="vault" type="button" hidden data-i18n-title="sidebar.vault" data-i18n-label="sidebar.vault">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="8" cy="15" r="4" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M11 12l9-9M17 6l3 3M14.5 8.5l2 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <button id="manage" type="button" data-i18n-title="sidebar.manage" data-i18n-label="sidebar.manage">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.3 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.3-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/>
        </svg>
      </button>
    </aside>

    <!-- Dialogs: the sidebar stretches over the whole window while they show. -->
    <div id="overlay" hidden>
      <section class="card" id="catalog-view" hidden>
        <header>
          <h2 data-i18n="catalog.title"></h2>
          <input id="search" type="search" data-i18n-placeholder="catalog.search" autocomplete="off" />
        </header>
        <div id="catalog" class="grid"></div>
      </section>

      <section class="card" id="switcher-view" hidden>
        <input id="switcher-search" type="search" data-i18n-placeholder="switcher.search" autocomplete="off" />
        <ul id="switcher-list" role="listbox"></ul>
        <p id="switcher-empty" data-i18n="switcher.empty" hidden></p>
      </section>

      <section id="home-view" hidden>
        <header id="home-clock">
          <time id="home-time"></time>
          <div>
            <div id="home-date"></div>
            <p id="home-greeting"></p>
          </div>
        </header>
        <aside id="music-player" aria-label="YouTube Music" hidden>
          <img id="music-artwork" alt="" hidden />
          <button type="button" id="music-open" class="music-open" data-i18n-label="music.open">
            <span class="music-cover"><span id="music-placeholder"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="16" rx="3" ry="2"/></svg></span></span>
            <span class="music-info"><strong id="music-title" data-i18n="music.empty"></strong><small id="music-artist"></small></span>
          </button>
          <div class="music-timeline">
            <div id="music-scrubber" class="music-scrubber">
              <span class="music-rest" aria-hidden="true"></span>
              <span class="music-played" aria-hidden="true"><span class="music-wave"></span></span>
              <input id="music-progress" type="range" min="0" max="1" value="0" step="0.1" data-i18n-label="music.progress" />
            </div>
            <div class="music-times"><span id="music-elapsed">0:00</span><span id="music-duration">0:00</span></div>
          </div>
          <div class="music-controls">
            <button type="button" id="music-previous" data-i18n-label="music.previous"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14"/><path d="m18 5-10 7 10 7Z" fill="currentColor" stroke="none"/></svg></button>
            <button type="button" id="music-toggle" data-i18n-label="music.play"><svg class="music-play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7Z" fill="currentColor"/></svg><svg class="music-pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="3.5"/></svg></button>
            <button type="button" id="music-next" data-i18n-label="music.next"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14"/><path d="m6 5 10 7-10 7Z" fill="currentColor" stroke="none"/></svg></button>
          </div>
          <label class="music-volume"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="m11 5-6 4H2v6h3l6 4ZM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></svg><span class="sr-only" data-i18n="music.volume"></span><input id="music-volume" type="range" min="0" max="100" step="1" data-i18n-label="music.volume" /></label>
          <small id="music-error" role="status" hidden></small>
        </aside>
        <div id="home-groups"></div>
        <p class="home-hint" data-i18n-html="home.hint"></p>
      </section>

      <div class="context-menu" id="menu-view" role="menu" hidden></div>

      <section class="card disabled-card" id="disabled-view" hidden>
        <span class="m-icon big" id="d-icon"></span>
        <h2 id="d-title"></h2>
        <p data-i18n="disabled.body"></p>
        <footer>
          <button type="button" id="d-enable" data-i18n="disabled.enable"></button>
        </footer>
      </section>

      <section class="card" id="manage-view" hidden>
        <header>
          <h2 data-i18n="manage.title"></h2>
          <button type="button" class="ghost-btn" data-close data-i18n="manage.close"></button>
        </header>
        <div class="zoom-row">
          <span><span data-i18n="zoom.label"></span> <small id="zoom-monitor"></small></span>
          <button type="button" class="ghost-btn icon-btn" id="zoom-out" data-i18n-title="zoom.out">−</button>
          <span id="zoom-value">100 %</span>
          <button type="button" class="ghost-btn icon-btn" id="zoom-in" data-i18n-title="zoom.in">+</button>
          <button type="button" class="ghost-btn" id="zoom-auto" data-i18n-title="zoom.reset" data-i18n="zoom.auto"></button>
        </div>
        <ul id="manage-list"></ul>
        <label class="check">
          <input id="ci-enabled" type="checkbox" />
          <span>
            <span data-i18n="manage.ci"></span>
            <small data-i18n="manage.ciHint"></small>
          </span>
        </label>
        <label class="check">
          <input id="vault-enabled" type="checkbox" />
          <span>
            <span data-i18n="manage.vault"></span>
            <small data-i18n="manage.vaultHint"></small>
          </span>
        </label>
        <label class="check">
          <input id="music-enabled" type="checkbox" />
          <span><span data-i18n="music.enabled"></span><small data-i18n="music.hint"></small></span>
        </label>
        <p id="music-settings-error" class="error" role="alert" hidden></p>
        <div class="zoom-row home-app-row">
          <span id="home-app-label" data-i18n="manage.homeApp"></span>
          <details id="home-app-picker" class="home-app-picker">
            <summary id="home-app-current" aria-haspopup="listbox"></summary>
            <div id="home-app" role="listbox" aria-labelledby="home-app-label"></div>
          </details>
        </div>
        <div class="links-box">
          <div class="links-head">
            <span data-i18n="links.title"></span>
            <button type="button" class="ghost-btn" id="links-add" data-i18n="links.add"></button>
          </div>
          <div id="links-list"></div>
          <small class="hint" data-i18n="links.hint"></small>
          <!-- Elegir la app de una regla: sin <select>, su lista nativa se cierra sola. -->
          <div class="context-menu" id="links-menu" role="menu" hidden></div>
        </div>
        <div class="zoom-row">
          <span data-i18n="manage.language"></span>
          <!-- Botones y no <select>: su lista nativa se cierra sola dentro del webview. -->
          <div id="language" class="segmented" role="radiogroup"></div>
        </div>
        <div class="zoom-row">
          <span data-i18n="manage.theme"></span>
          <div id="theme" class="segmented" role="radiogroup"></div>
        </div>
        <div class="zoom-row">
          <span data-i18n="wallpaper.title"></span>
          <button type="button" class="ghost-btn" id="wallpaper-open" data-i18n="wallpaper.choose"></button>
        </div>
        <p class="hint" data-i18n="manage.hint"></p>
      </section>

      <!-- CI ocupa el área de las apps, como una más. Sus modales van encima. -->
      <section id="ci-view" class="page-view" hidden>
        <header>
          <h2 data-i18n="ci.title"></h2>
          <button type="button" class="ghost-btn" id="ci-setup-open" data-i18n="ci.setup"></button>
        </header>
        <ul id="ci-runs"></ul>
        <p id="ci-empty" class="hint"></p>
      </section>

      <!-- Fondo de pantalla (inicio, CI y diálogos): página completa; arriba fijo, abajo los
           resultados con scroll. -->
      <section id="wallpaper-view" hidden>
        <header>
          <h2 data-i18n="wallpaper.title"></h2>
          <button type="button" class="ghost-btn" id="wallpaper-own" data-i18n="wallpaper.own"></button>
          <button type="button" class="ghost-btn" id="wallpaper-none" data-i18n="wallpaper.none"></button>
          <button type="button" class="ghost-btn" data-close data-i18n="manage.close"></button>
          <input id="wallpaper-file" type="file" accept="image/jpeg,image/png,image/webp" hidden />
        </header>
        <p id="wallpaper-error" class="error" role="alert"></p>
        <h3 data-i18n="wallpaper.saved"></h3>
        <div id="wallpaper-saved"></div>
        <div class="wallpaper-search">
          <h3>Wallhaven</h3>
          <input id="wallpaper-query" type="search" data-i18n-placeholder="wallpaper.search" autocomplete="off" />
          <div id="wallpaper-sorting" class="segmented" role="radiogroup"></div>
        </div>
        <!-- Solo los resultados se desplazan: lo de arriba queda fijo. -->
        <div id="wallpaper-scroll">
          <div class="wallpaper-grid" id="wallpaper-results"></div>
          <button type="button" class="ghost-btn" id="wallpaper-more" data-i18n="wallpaper.more" hidden></button>
        </div>
        <div id="wallpaper-toast" role="status" aria-live="polite"></div>
      </section>

      <section class="card ci-modal" id="ci-setup-view" hidden>
        <header>
          <h2 data-i18n="ci.setupTitle"></h2>
          <input id="ci-repo-search" type="search" data-i18n-placeholder="ci.repoSearch" autocomplete="off" />
        </header>
        <div id="ci-tree"></div>
        <p id="ci-error" class="error" role="alert"></p>
        <footer>
          <button type="button" class="ghost" id="ci-token-open" data-i18n="ci.addTokenButton"></button>
          <button type="button" data-close data-i18n="ci.setupDone"></button>
        </footer>
      </section>

      <form class="card ci-modal" id="ci-token-view" hidden autocomplete="off">
        <h2 data-i18n="ci.addTokenTitle"></h2>
        <input id="ci-token-name" type="text" data-i18n-placeholder="ci.tokenName" />
        <div class="link-row">
          <input id="ci-token" type="password" data-i18n-placeholder="ci.tokenPlaceholder" />
          <button type="button" class="ghost-btn" id="ci-token-check" data-i18n="ci.check"></button>
        </div>
        <small class="hint" data-i18n-html="ci.tokenHint"></small>
        <div class="links-box" id="ci-token-box" hidden>
          <div class="links-head">
            <span id="ci-token-login"></span>
            <input id="ci-token-search" type="search" data-i18n-placeholder="ci.repoSearch" autocomplete="off" />
          </div>
          <div id="ci-token-repos"></div>
        </div>
        <p id="ci-token-error" class="error" role="alert"></p>
        <footer>
          <button type="button" class="ghost" data-close data-i18n="action.cancel"></button>
          <button type="submit" id="ci-token-ok" data-i18n="ci.addToken" disabled></button>
        </footer>
      </form>

      <form class="card" id="vault-view" hidden autocomplete="off">
        <h2 data-i18n="vault.title"></h2>
        <p id="vault-message" aria-live="polite"></p>
        <input id="vault-password" type="password" data-i18n-placeholder="vault.password" hidden />
        <div id="vault-list" role="listbox" hidden></div>
        <p id="vault-error" class="error" role="alert"></p>
        <footer>
          <button type="button" class="ghost" id="vault-lock" data-i18n="vault.lock" hidden></button>
          <button type="button" class="ghost" data-close data-i18n="action.cancel"></button>
          <button type="submit" id="vault-unlock" data-i18n="vault.unlock" hidden></button>
        </footer>
      </form>

      <form class="card" id="form-view" hidden autocomplete="off">
        <h2 id="form-title"></h2>
        <label>
          <span data-i18n="form.name"></span>
          <input id="f-name" type="text" data-i18n-placeholder="form.namePlaceholder" />
        </label>
        <label>
          <span data-i18n="form.url"></span>
          <input id="f-url" type="text" placeholder="https://…" required />
        </label>
        <label class="suggest-field">
          <span data-i18n="form.group"></span>
          <input id="f-group" type="text" data-i18n-placeholder="form.groupPlaceholder" />
          <!-- Sin <datalist>: su lista nativa se cierra sola dentro del webview. -->
          <div class="suggest" id="groups" role="listbox" hidden></div>
        </label>
        <div class="field">
          <span class="field-label" data-i18n="form.icon"></span>
          <div class="icon-row">
            <span class="service icon-preview" id="f-icon"></span>
            <button type="button" class="ghost-btn" data-icon="custom" data-i18n="form.iconCustom"></button>
            <button type="button" class="ghost-btn" data-icon="web" data-i18n="form.iconWeb"></button>
            <button type="button" class="ghost-btn" data-icon="letter" data-i18n="form.iconLetter"></button>
            <input id="f-icon-file" type="file" accept="image/*" hidden />
          </div>
        </div>
        <label class="check">
          <input id="f-adblock" type="checkbox" />
          <span>
            <span data-i18n="form.adblock"></span>
            <small data-i18n="form.adblockHint"></small>
          </span>
        </label>
        <div class="field">
          <span class="field-label" data-i18n="form.theme"></span>
          <div id="f-theme" class="segmented" role="radiogroup"></div>
          <small class="dnd-hint" data-i18n="form.themeHint"></small>
        </div>
        <div class="field">
          <span class="field-label" data-i18n="dnd.title"></span>
          <div id="f-dnd-list"></div>
          <button type="button" class="ghost-btn dnd-add" id="f-dnd-add" data-i18n="dnd.add"></button>
          <small class="dnd-hint" data-i18n="dnd.hint"></small>
        </div>
        <p id="f-error" class="error" role="alert"></p>
        <footer>
          <button type="button" class="ghost" data-close data-i18n="action.cancel"></button>
          <button type="submit" id="f-submit"></button>
        </footer>
      </form>

      <section class="card" id="update-view" hidden>
        <h2 id="update-title"></h2>
        <p id="update-body" data-i18n="update.body"></p>
        <progress id="update-progress" max="1" value="0" hidden></progress>
        <p id="update-error" class="error" role="alert"></p>
        <footer>
          <button type="button" class="ghost" id="update-later" data-close data-i18n="update.later"></button>
          <button type="button" id="update-install" data-i18n="update.install"></button>
        </footer>
      </section>

      <section class="card" id="confirm-view" hidden>
        <h2 id="confirm-title"></h2>
        <p data-i18n="confirm.body"></p>
        <footer>
          <button type="button" class="ghost" data-close data-i18n="action.cancel"></button>
          <button type="button" class="danger" id="confirm-ok" data-i18n="action.remove"></button>
        </footer>
      </section>
    </div>

    <!-- Divisor entre la página inicial y su app: se arrastra para cambiar la altura. -->
    <div id="pane-handle" role="separator" aria-orientation="horizontal" data-i18n-title="home.paneHandle"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
