[package]
name = "pulpo"
version = "0.1.0"
description = "Pulpo — all your web apps in one window, without ads"
authors = ["eitalouarruda"]
edition = "2021"

[workspace]
members = ["crates/blocker"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lib]
name = "pulpo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.3", features = [] }

[dependencies]
# `unstable`: varios webviews dentro de una ventana (Window::add_child).
# Tauri 3 (alpha) porque es el que trae el runtime CEF (Chromium) para Linux.
tauri = { version = "=3.0.0-alpha.4", features = ["unstable"] }
tauri-plugin-opener = "=3.0.0-alpha.2"
serde.workspace = true
serde_json.workspace = true
# Descarga de iconos de los servicios.
ureq = "3"
base64 = "0.22"
# Hora local para los horarios de no molestar.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Tokens de GitHub de la vista CI, en el llavero del sistema.
keyring = "4"
# Aviso al terminar un run de CI.
notify-rust = "4"

# Linux: Chromium (CEF). WebKitGTK es ~3 veces más lento navegando YouTube Music.
[target.'cfg(target_os = "linux")'.dependencies]
blocker = { path = "crates/blocker" }
tauri-runtime-cef = { version = "=3.0.0-alpha.5", features = ["unstable"] }
# Seguir el puntero durante un arrastre (ver `platform/linux_drag.rs`).
x11-dl = "2.21"
# Tabla de compose de libxkbcommon (ver `platform/linux_compose.rs`).
libloading = "0.8"

# Windows: WebView2, que ya es Chromium y viene con el sistema.
[target.'cfg(windows)'.dependencies]
blocker = { path = "crates/blocker" }
# Icono en la bandeja del sistema: al cerrar, Pulpo sigue ahí (ver `tray.rs`).
tauri = { version = "=3.0.0-alpha.4", features = ["unstable", "tray-icon"] }
# Una sola instancia: abrir Pulpo otra vez muestra la que sigue en la bandeja.
tauri-plugin-single-instance = "=3.0.0-alpha.3"
tauri-runtime-wry = { version = "=3.0.0-alpha.4", features = ["unstable"] }
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    # Terminar los navegadores de WebView2 que sigan vivos al salir (ver `quit`).
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }
windows-core = "0.62"

[profile.release]
lto = true
codegen-units = 1
strip = true
